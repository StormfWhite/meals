<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal Planner</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<div id="topbar">
  <button class="icon-btn" id="back-btn" title="Back to the plan" hidden>
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </button>
  <div class="brandline" id="brand">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/></svg>
  </div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="list-btn" title="Grocery list  (G)">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h15l-2 9H8L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
    <span class="badge" id="list-count"></span>
  </button>
  <button class="icon-btn" id="pantry-btn" title="Pantry — fridge, pantry, freezer, and what's running low">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M9.5 11v2M14.5 11v2"/></svg>
    <span class="badge" id="pantry-count"></span>
  </button>
  <div class="vsep"></div>
  <button class="icon-btn nav-icon" data-view="nutrition" title="Nutrition">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 20V10M6 20V14M18 20V6"/></svg>
  </button>
  <button class="icon-btn nav-icon" data-view="recipes" title="Recipes &amp; ingredients">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
  </button>
  <button class="icon-btn nav-icon" data-view="groceries" title="Full grocery view">
    <svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
  </button>
  <button class="icon-btn nav-icon" data-view="history" title="History">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
  </button>
  <button class="icon-btn nav-icon" data-view="settings" title="Household &amp; settings">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="body"></div>

<div id="modal-backdrop">
  <div class="modal-panel" id="modal-panel"></div>
</div>

<div id="bangers-dock"></div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
<script src="ingsuggest.js"></script>
<script src="storepicker.js"></script>
<script src="mealblock.js"></script>
<script src="groceriespanel.js"></script>
<script src="bangers.js"></script>
<script src="plan.js"></script>
<script src="nutrition.js"></script>
<script src="groceries.js"></script>
<script src="history.js"></script>
<script src="settings.js"></script>
<script src="recipes.js"></script>
</body>
</html>
